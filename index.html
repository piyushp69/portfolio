<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f5" />
    <!-- Applies a saved dark theme before first paint, so a returning visitor
         never sees a flash of the light one. Mirrors src/lib/theme.js. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#0f0e0d'
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="Piyush Priyanshu - Data Analyst specialising in predictive modelling, machine learning pipelines and business intelligence dashboards."
    />
    <meta name="author" content="Piyush Priyanshu" />

    <!-- Canonical, og:url and og:image are added at build time once SITE_URL is known (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Piyush Priyanshu" />
    <meta property="og:title" content="Piyush Priyanshu | Data Analyst" />
    <meta
      property="og:description"
      content="Data Analyst turning fragmented data into predictive models and decision-ready dashboards."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Piyush Priyanshu | Data Analyst" />
    <meta
      name="twitter:description"
      content="Data Analyst turning fragmented data into predictive models and decision-ready dashboards."
    />

    <!-- Fonts are self-hosted (src/styles/fonts.css). Preloading the Latin
         files starts them alongside the app bundle, so text is laid out once,
         already in its final font. -->
    <link
      rel="preload"
      href="/src/assets/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Piyush Priyanshu | Data Analyst</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
